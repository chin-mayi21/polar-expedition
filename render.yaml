services:
  - type: web
    name: cryolink
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        value: file:./data/prod.db
      - key: AUTH_SECRET
        generateValue: true
      # Must be your public Render URL — never localhost or :10000
      - key: AUTH_URL
        value: https://cryolink-bk00.onrender.com
